<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f7f8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#080b0d" />
    <title>Foco &amp; Treino</title>
    <script>
      // roda antes de qualquer pintura: sem isso a tela pisca clara
      // antes do React aplicar a preferência salva
      try {
        var t = localStorage.getItem('app.tema')
        if (t === 'claro' || t === 'escuro') document.documentElement.setAttribute('data-tema', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
